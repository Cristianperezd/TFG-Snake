name: Web build

# Builds the browser version with pygbag and publishes it on GitHub Pages
# (https://cristianperezd.github.io/TFG-Snake/). Pull requests only build it,
# to show that it still builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygbag==0.9.3
      # Packs web/main.py and snake_ai (without snake_ai.rl) into build/snake-ai/build/web
      - run: python web/build.py
      - name: Check the build
        run: |
          cd build/snake-ai/build/web
          ls -l
          test -f index.html
          tar tzf snake-ai.tar.gz | tee files.txt
          grep -q "snake_ai/browser.py" files.txt
          ! grep -q "snake_ai/rl" files.txt
          rm files.txt
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/snake-ai/build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
